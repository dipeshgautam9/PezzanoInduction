<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pezzano Enterprise Warehouse Induction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="session.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header>
    <h1>Pezzano Enterprise Warehouse Induction</h1>
    <nav id="authNav">
      <span id="userGreeting" style="margin-right:12px;"></span>
      <button id="signOutBtn" style="display:none;">Sign out</button>
    </nav>
  </header>

  <main>
    <section id="authSection">
      <h2>Sign in</h2>
      <form id="signInForm">
        <label>Email<br /><input type="email" id="signInEmail" required /></label>
        <br />
        <label>Password<br /><input type="password" id="signInPassword" required /></label>
        <br />
        <button type="submit">Sign in</button>
      </form>

      <h3>New employee? Create account</h3>
      <form id="signUpForm">
        <label>Employee code<br /><input type="text" id="suEmployeeCode" required /></label>
        <br />
        <label>Full name<br /><input type="text" id="suFullName" required /></label>
        <br />
        <label>Email<br /><input type="email" id="suEmail" required /></label>
        <br />
        <label>Password<br /><input type="password" id="suPassword" required /></label>
        <br />
        <label>Department<br />
          <select id="suDepartment"></select>
        </label>
        <br />
        <label>Position<br />
          <select id="suPosition"></select>
        </label>
        <br />
        <label>Work location<br />
          <input type="text" id="suWorkLocation" value="Canning Vale" />
        </label>
        <br />
        <button type="submit">Create account</button>
      </form>
    </section>

    <section id="portalSection" style="display:none;">
      <h2 id="portalTitle">Welcome to your induction</h2>
      <p id="portalSubtitle"></p>

      <h3>Modules</h3>
      <div id="modulesList"></div>

      <h3>Product familiarisation</h3>
      <div id="productsList"></div>

      <h3>Documents</h3>
      <div id="documentsSection">
        <form id="docUploadForm">
          <label>Document type
            <select id="docType" required>
              <option value="passport">Passport</option>
              <option value="visa">Visa</option>
              <option value="forklift_license">Forklift licence</option>
            </select>
          </label>
          <br />
          <label>Document subtype (optional)<br /><input type="text" id="docSubtype" /></label>
          <br />
          <label>Document number (optional)<br /><input type="text" id="docNumber" /></label>
          <br />
          <label>Expiry date (optional)<br /><input type="date" id="docExpiry" /></label>
          <br />
          <label>File name<br /><input type="text" id="docFileName" required /></label>
          <br />
          <label>Notes (optional)<br /><textarea id="docNotes"></textarea></label>
          <br />
          <button type="submit">Save document record</button>
        </form>
        <div id="documentsList"></div>
      </div>
    </section>
  </main>

  <script>
    const authSection = document.getElementById('authSection');
    const portalSection = document.getElementById('portalSection');
    const userGreeting = document.getElementById('userGreeting');
    const signOutBtn = document.getElementById('signOutBtn');

    async function hydrateAuthUI() {
      const { employee } = await window.initSession();
      if (employee) {
        authSection.style.display = 'none';
        portalSection.style.display = 'block';
        userGreeting.textContent = `Signed in as ${employee.full_name} (${employee.role})`;
        signOutBtn.style.display = 'inline-block';
        await loadPortalData(employee);
      } else {
        authSection.style.display = 'block';
        portalSection.style.display = 'none';
        userGreeting.textContent = '';
        signOutBtn.style.display = 'none';
      }
    }

    async function loadPortalData(employee) {
      document.getElementById('portalSubtitle').textContent =
        `Department: ${employee.department || 'General'} | Position: ${employee.position || 'Team Member'} | Location: ${employee.work_location || 'Canning Vale'}`;

      try {
        const [depts, pos] = await Promise.all([window.getDepartments(), window.getPositions()]);
        const deptSel = document.getElementById('suDepartment');
        const posSel = document.getElementById('suPosition');
        deptSel.innerHTML = depts.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
        posSel.innerHTML = pos.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
      } catch (e) {
        console.error('Failed to load departments/positions', e);
      }

      const modules = [
        { id: 'whs_basics', title: 'WHS Basics' },
        { id: 'warehouse_ops', title: 'Warehouse Operations' },
        { id: 'product_handling', title: 'Product Handling' }
      ];
      const modulesList = document.getElementById('modulesList');
      const progress = await window.getModuleProgress(employee.id);
      const byModule = Object.fromEntries(progress.map(p => [p.module_id, p]));

      modulesList.innerHTML = modules.map(m => {
        const p = byModule[m.id];
        const done = p?.completed ? 'Completed' : 'In progress';
        return `
          <div style="border:1px solid #ccc; margin:8px 0; padding:8px;">
            <strong>${m.title}</strong> — ${done}
            <button data-module="${m.id}">Mark complete</button>
          </div>
        `;
      }).join('');

      modulesList.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', async () => {
          const moduleId = btn.getAttribute('data-module');
          await window.completeModule({ employee_id: employee.id, module_id: moduleId });
          await hydrateAuthUI();
        });
      });

      const products = await window.getProductPhotos({ department: employee.department });
      const productsList = document.getElementById('productsList');
      productsList.innerHTML = products.slice(0, 20).map(p => `
        <div style="border:1px solid #ccc; margin:8px 0; padding:8px;">
          <strong>${p.name}</strong> (${p.category})
          <br />
          <button data-product="${p.id}">Confirm understanding</button>
        </div>
      `).join('');

      productsList.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', async () => {
          const productId = btn.getAttribute('data-product');
          await window.confirmProduct({ employee_id: employee.id, product_id: productId, correct: true });
          alert('Product confirmed');
        });
      });

      const docs = await window.getEmployeeDocuments(employee.id);
      const docsList = document.getElementById('documentsList');
      docsList.innerHTML = docs.length
        ? `<ul>${docs.map(d => `<li>${d.doc_type} — ${d.file_name || '(no file)'} (${d.doc_subtype || ''})</li>`).join('')}</ul>`
        : '<p>No documents uploaded yet.</p>';
    }

    document.getElementById('signInForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signInEmail').value;
      const password = document.getElementById('signInPassword').value;
      try {
        await window.signIn(email, password);
        await hydrateAuthUI();
      } catch (err) {
        alert('Sign in failed: ' + (err.message || err));
      }
    });

    document.getElementById('signUpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        employee_code: document.getElementById('suEmployeeCode').value,
        full_name: document.getElementById('suFullName').value,
        email: document.getElementById('suEmail').value,
        password: document.getElementById('suPassword').value,
        department: document.getElementById('suDepartment').value,
        position: document.getElementById('suPosition').value,
        work_location: document.getElementById('suWorkLocation').value
      };
      try {
        await window.signUpEmployee(payload);
        alert('Account created. Please sign in.');
        await hydrateAuthUI();
      } catch (err) {
        alert('Sign up failed: ' + (err.message || err));
      }
    });

    signOutBtn.addEventListener('click', async () => {
      await window.signOut();
      await hydrateAuthUI();
    });

    document.getElementById('docUploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const employee = window.getCachedEmployee();
      if (!employee) {
        alert('You must be signed in to upload documents.');
        return;
      }
      const payload = {
        employee_id: employee.id,
        doc_type: document.getElementById('docType').value,
        doc_subtype: document.getElementById('docSubtype').value || null,
        doc_number: document.getElementById('docNumber').value || null,
        expiry_date: document.getElementById('docExpiry').value || null,
        file_name: document.getElementById('docFileName').value,
        file_path: null,
        notes: document.getElementById('docNotes').value || null
      };
      try {
        await window.uploadEmployeeDocument(payload);
        alert('Document record saved.');
        await hydrateAuthUI();
      } catch (err) {
        alert('Document save failed: ' + (err.message || err));
      }
    });

    hydrateAuthUI();
  </script>

  <script>
    // Identify product from photo using the AI endpoint
    async function identifyProductFromPhoto(file) {
      const employee = window.getCachedEmployee?.() || (await window.initSession())?.employee;
      if (!employee) {
        alert('You must be signed in to identify products.');
        return;
      }

      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      // Build candidates: fetch product photos for this employee's department
      const supabase = window.supabase?.createClient?.(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
      let candidates = [];
      if (supabase && employee.department) {
        const { data } = await supabase
          .from('product_photos')
          .select('id, name, category, image_path')
          .eq('department', employee.department)
          .limit(40);
        candidates = data || [];
      }

      const aiRes = await fetch('/api/identify-product', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ staffPhoto: dataUrl, candidates })
      });

      if (!aiRes.ok) {
        const err = await aiRes.json().catch(() => ({ error: 'Service unavailable' }));
        console.error('Identify product failed:', err);
        alert('⚠ Couldn\'t identify this product\nThe identification service is temporarily unavailable. Please try again later.');
        return;
      }

      const { productId, productName, confidence } = await aiRes.json();

      if (productId && productName) {
        alert('✅ Identified product:\n' + productName + '\n(Confidence: ' + Math.round(confidence * 100) + '%)');
      } else {
        alert('⚠ Couldn\'t identify this product\nThe photo didn\'t closely match any product in your department\'s library. Try a clearer, better-lit photo of the label or the product itself.');
      }
    }

    // Bind to your photo input (adjust ID if needed)
    const photoInput = document.getElementById('identifyPhotoInput');
    if (photoInput) {
      photoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) identifyProductFromPhoto(file);
      });
    }
  </script>
</body>
</html>
